services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_PASSWORD: "12345678"
      DB_USER: postgres
      DB_NAME: postgres
    networks:
      - jeftinko
    depends_on:
      - database
    ports:
      - 8081:3000
    volumes:
      - media-data:/app/media

  database:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: "12345678"
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    networks:
      - jeftinko

networks:
  jeftinko:
    name: jefinko-network
    driver: bridge

volumes:
  postgres-data:
  media-data: